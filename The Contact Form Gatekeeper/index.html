<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form Gatekeeper</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Contact Form</h1>
      <p id="mini-header">Feel free to reach out to us. Your message gets read within 24hrs</p>
      <div class="form-field">
        <form id="contact-form">
          <input id="name" placeholder="Your name" />
          <input id="email" placeholder="Your email" />
          <textarea id="message-box" placeholder="Leave a message..."></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
      <p id="form-msg"></p>
    </main>
  </body>
</html>
